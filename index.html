<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Campus Secondhand Trading Platform DB System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://s4.zstatic.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="flex h-screen">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full z-10">
            <div class="p-5 border-b border-gray-200">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white">
                        <i class="fas fa-university"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-gray-800 text-sm leading-tight">Campus Secondhand</h1>
                        <p class="text-xs text-gray-500">DB System</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto py-3">
                <div class="px-3 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">Navigation</div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3 active" data-page="home">
                    <i class="fas fa-home w-5 text-center"></i> Home
                </div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3" data-page="dbdef">
                    <i class="fas fa-database w-5 text-center"></i> DB Definition
                </div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3" data-page="dataops">
                    <i class="fas fa-edit w-5 text-center"></i> Data Operations
                </div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3" data-page="items">
                    <i class="fas fa-box w-5 text-center"></i> Item List
                </div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3" data-page="users">
                    <i class="fas fa-users w-5 text-center"></i> User List
                </div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3" data-page="orders">
                    <i class="fas fa-receipt w-5 text-center"></i> Order List
                </div>
                <div class="px-3 mt-4 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">Queries</div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3" data-page="basic">
                    <i class="fas fa-search w-5 text-center"></i> Basic Query
                </div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3" data-page="join">
                    <i class="fas fa-link w-5 text-center"></i> Join Query
                </div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3" data-page="agg">
                    <i class="fas fa-chart-bar w-5 text-center"></i> Aggregation
                </div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3" data-page="views">
                    <i class="fas fa-eye w-5 text-center"></i> Views
                </div>
                <div class="nav-item px-4 py-2.5 text-sm text-gray-700 flex items-center gap-3" data-page="buy">
                    <i class="fas fa-shopping-cart w-5 text-center"></i> Buy Item
                </div>
            </nav>
            <div class="p-4 border-t border-gray-200 text-xs text-gray-500">
                <div class="flex items-center gap-2 mb-1"><div class="w-2 h-2 rounded-full bg-green-500"></div> Database Ready</div>
                <div>SQLite (In-Browser JS)</div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 ml-64 overflow-y-auto" id="main-content">
            <!-- Pages will be dynamically inserted by app.js -->
        </main>
    </div>

    <!-- SQL.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
    <!-- Application Logic -->
    <script src="js/app.js"></script>
</body>
</html>
